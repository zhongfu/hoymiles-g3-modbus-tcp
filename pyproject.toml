[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoymiles-g3-modbus-tcp"
version = "0.1.0"
description = "Async async read/decode of Hoymiles G3 hybrid inverter live telemetry over Modbus TCP"
requires-python = ">=3.11"
dependencies = ["pymodbus>=3.15"]

[tool.setuptools]
packages = ["hoymiles_g3_modbus_tcp"]
